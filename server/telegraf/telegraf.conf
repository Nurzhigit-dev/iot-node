[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true
  skip_processors_after_aggregators = true

# INPUT: sensor readings from our Mosquitto
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iot-node-6g7l/+/env"]
  qos = 1
  client_id = "telegraf"
  # Keep the subscription on the broker while Telegraf is disconnected, so readings
  # published in the meantime are queued for us instead of dropped
  persistent_session = true
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  name_override = "environment"

  # Take the second part of the topic (node1) and store it as the tag "node"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/env"
    tags = "_/node/_"

# INPUT: device status ("online, fw 1.0.0" / "offline"), shows firmware changes
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iot-node-6g7l/+/status"]
  qos = 1
  client_id = "telegraf-status"
  persistent_session = true
  data_format = "value"
  data_type = "string"
  name_override = "status"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/status"
    tags = "_/node/_"

# How long after the measurement each reading reached the server. About 0 s normally;
# readings re-sent from the device's buffer after an outage show how long they waited.
[[processors.starlark]]
  namepass = ["environment"]
  source = '''
load("time.star", "time")

def apply(metric):
    metric.fields["delay_s"] = (time.now().unix_nano - metric.time) / 1e9
    return metric
'''

# OUTPUT: write to InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "iot-node-dev-token"
  organization = "iot"
  bucket = "sensors"
