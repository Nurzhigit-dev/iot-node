[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# INPUT: subscribe to the sensor topics on our Mosquitto
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["iot-node-6g7l/+/env"]
  qos = 1
  client_id = "telegraf"
  data_format = "json"
  json_time_key = "ts"
  json_time_format = "unix_ms"
  name_override = "environment"

  # Take the second part of the topic (node1) and store it as the tag "node"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "+/+/env"
    tags = "_/node/_"

# OUTPUT: write to InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "iot-node-dev-token"
  organization = "iot"
  bucket = "sensors"