listener 1883
allow_anonymous true

# Remember Telegraf's subscription (persistent session) across broker restarts.
# Without this, readings the device re-sends right after the broker comes back,
# before Telegraf has reconnected, are acknowledged and then dropped.
persistence true
persistence_location /mosquitto/data/
# QoS 1 messages queued per disconnected subscriber: must hold a full device buffer
max_queued_messages 10000

log_dest stdout
